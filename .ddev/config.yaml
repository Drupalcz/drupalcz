name: drupalcz
type: drupal10
docroot: docroot
# Matches the cloud hosting, which runs 8.4 — do not raise without raising it there.
php_version: "8.4"
webserver_type: apache-fpm
nodejs_version: "22"
router_http_port: "80"
router_https_port: "443"
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
  type: mysql
  version: "5.7"
use_dns_when_possible: true
composer_version: "2"
web_environment: []

hooks:
  post-start:
    - exec: scripts/create-settings.sh
